# A finger that doesn't match plays Auth failed on Lock's Sen, which settles worried beside
# "Not quite.". Records the scan and the miss. Written, not yet run on a device.
appId: com.kaiz404.sen
---
- runFlow:
    file: subflows/at-lock.yaml
    env:
      AUTH: fail
- extendedWaitUntil:
    notVisible:
      id: launch
    timeout: 10000
- startRecording: shots/motion/record-auth-failed
- tapOn:
    id: unlock
- extendedWaitUntil:
    visible: Not quite.
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- stopRecording
- takeScreenshot: shots/motion/auth-failed-settled

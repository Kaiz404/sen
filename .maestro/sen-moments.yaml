# Every Sen moment in turn through sen-moment.yaml, on the light theme. Not yet run on a device.
# maestro test .maestro/sen-moments.yaml
appId: com.kaiz404.sen
---
- runFlow:
    file: sen-moment.yaml
    env:
      MOMENT: launch
- runFlow:
    file: sen-moment.yaml
    env:
      MOMENT: unlock
- runFlow:
    file: sen-moment.yaml
    env:
      MOMENT: reveal
- runFlow:
    file: sen-moment.yaml
    env:
      MOMENT: remask
- runFlow:
    file: sen-moment.yaml
    env:
      MOMENT: face-scan
- runFlow:
    file: sen-moment.yaml
    env:
      MOMENT: auth-failed
- runFlow:
    file: sen-moment.yaml
    env:
      MOMENT: lockout
- runFlow:
    file: sen-moment.yaml
    env:
      MOMENT: network-error
- runFlow:
    file: sen-moment.yaml
    env:
      MOMENT: refresh
- runFlow:
    file: sen-moment.yaml
    env:
      MOMENT: empty-search
- runFlow:
    file: sen-moment.yaml
    env:
      MOMENT: copy
- runFlow:
    file: sen-moment.yaml
    env:
      MOMENT: theme-light
- runFlow:
    file: sen-moment.yaml
    env:
      MOMENT: theme-dark

# Reviewer control "Simulate lockout": the next unlock shows the lockout cool-down without a prompt. The
# screen-lock key then unlocks for real, and the control reads disarmed. Arming and tapping again disarms it.
appId: com.kaiz404.sen
---
- runFlow: subflows/at-history.yaml
- tapOn: Settings
- scrollUntilVisible:
    element: Simulate .* lockout
    direction: DOWN
    centerElement: true
- tapOn: Simulate .* lockout
- extendedWaitUntil:
    visible: Lockout armed
    timeout: 5000
- takeScreenshot: reviewer-lockout-armed
- tapOn: Lockout armed
- assertVisible: Simulate .* lockout
- tapOn: Simulate .* lockout
- scrollUntilVisible:
    element: Lock now
    direction: DOWN
- tapOn: Lock now
- extendedWaitUntil:
    visible:
      id: unlock
    timeout: 10000
- tapOn:
    id: unlock
- extendedWaitUntil:
    visible: Too many tries.
    timeout: 10000
- assertVisible: Use screen lock
- takeScreenshot: reviewer-lockout
- tapOn: Use screen lock
- extendedWaitUntil:
    visible:
      id: tx-row
    timeout: 15000
- tapOn: Settings
- scrollUntilVisible:
    element: Simulate .* lockout
    direction: DOWN
    centerElement: true
- takeScreenshot: reviewer-lockout-disarmed

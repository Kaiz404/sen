# A biometric lockout is not a dead end: its Use screen lock key opens Sen, because the screen lock is not locked out.
appId: com.kaiz404.sen
---
- runFlow:
    file: subflows/at-lock.yaml
    env:
      AUTH: lockout
- tapOn:
    id: unlock
- extendedWaitUntil:
    visible: Too many tries.
    timeout: 15000
- tapOn: Use screen lock
- extendedWaitUntil:
    notVisible: Too many tries.
    timeout: 15000
- assertVisible:
    id: history
- takeScreenshot: auth-lockout-screen-lock

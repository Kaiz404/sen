# A passing check plays Unlock on Lock's Sen, which holds Lock with "Unlocked" until it lands, then
# History opens. Records the moment. tapOn waits about 10 s for the looping Sen to settle, so the
# transient "Unlocked" is gone before any assert runs. The flow asserts History, and the recording
# is the evidence of the moment. Written, not yet run on a device.
appId: com.kaiz404.sen
---
- runFlow:
    file: subflows/at-lock.yaml
    env:
      AUTH: pass
- startRecording: shots/motion/record-unlock
- tapOn:
    id: unlock
- extendedWaitUntil:
    visible:
      id: history
    timeout: 30000
- stopRecording
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: shots/motion/unlock-settled

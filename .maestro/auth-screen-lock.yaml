# Use screen lock opens History without the biometric prompt (the dev override answers the screen lock, D40).
appId: com.kaiz404.sen
---
- runFlow:
    file: subflows/at-lock.yaml
    env:
      AUTH: pass
- tapOn: Use screen lock
- extendedWaitUntil:
    notVisible:
      id: unlock
    timeout: 15000
- assertVisible:
    id: history
- takeScreenshot: auth-screen-lock

# Not run yet: needs a device. Unlocks to History first through the pass override, which also answers the
# step-up prompt. Adds RM 42.50 "Lunch with Hafiz, cash" and saves it. Then run add-saved.yaml.
appId: com.kaiz404.sen
---
- runFlow: subflows/at-history.yaml
- extendedWaitUntil:
    visible: Add a transaction
    timeout: 20000
- tapOn: Add a transaction
- extendedWaitUntil:
    visible: Amount, step 1 of 3
    timeout: 10000
- tapOn: "4"
- tapOn: "2"
- tapOn: "5"
- tapOn: "0"
- takeScreenshot: shots/4b/flow-add-amount
- tapOn: Next
- extendedWaitUntil:
    visible: Details, step 2 of 3
    timeout: 10000
- tapOn: Description
- inputText: Lunch with Hafiz, cash
- hideKeyboard
- tapOn: Food & drink
- takeScreenshot: shots/4b/flow-add-details
- tapOn: Next
- extendedWaitUntil:
    visible: Review, step 3 of 3
    timeout: 10000
- takeScreenshot: shots/4b/flow-add-review
- tapOn: Save with fingerprint

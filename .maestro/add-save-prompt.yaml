# Not run yet: needs a device. On History, unlocked. Adds RM 42.50 "Lunch with Hafiz, cash" and leaves the
# step-up prompt up for `adb -e emu finger touch 1`. Then run add-saved.yaml.
appId: com.kaiz404.sen
---
- extendedWaitUntil:
    visible: Add a transaction
    timeout: 20000
- tapOn: Add a transaction
- extendedWaitUntil:
    visible: STEP 1 OF 3 · AMOUNT
    timeout: 10000
- tapOn: "4"
- tapOn: "2"
- tapOn: "5"
- tapOn: "0"
- takeScreenshot: shots/4b/flow-add-amount
- tapOn: Next
- extendedWaitUntil:
    visible: STEP 2 OF 3 · DETAILS
    timeout: 10000
- tapOn: Description
- inputText: Lunch with Hafiz, cash
- hideKeyboard
- tapOn: Food & drink
- takeScreenshot: shots/4b/flow-add-details
- tapOn: Next
- extendedWaitUntil:
    visible: STEP 3 OF 3 · REVIEW
    timeout: 10000
- takeScreenshot: shots/4b/flow-add-review
- tapOn: Save with fingerprint

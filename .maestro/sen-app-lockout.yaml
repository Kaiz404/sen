# The phone's lockout makes the napping Sen sigh, then it breathes face-on through the cool-down.
# The cool-down counts down while tapOn waits for the screen to settle, so the assert takes any second
# of 0:00 to 0:29, never one exact second. Records the sigh and a few breaths. Written, not yet run on a device.
appId: com.kaiz404.sen
---
- runFlow:
    file: subflows/at-lock.yaml
    env:
      AUTH: lockout
- startRecording: shots/motion/record-lockout
- tapOn:
    id: unlock
- extendedWaitUntil:
    visible: Too many tries.
    timeout: 15000
- extendedWaitUntil:
    visible: "0:[0-2][0-9]"
    timeout: 15000
- stopRecording
- takeScreenshot: shots/motion/lockout-breathing

# Not run yet: needs a device. Unlocks to History first. On Details, Pick a date opens the system calendar, which
# is not Sen's own view, so its buttons are found by their text (OK, Cancel). The 1st of the current month is
# always inside the last 90 days and never in the future, so the flow picks it whatever today is.
# Cancel keeps that date. The dialog follows the phone's light or dark mode.
appId: com.kaiz404.sen
---
- runFlow: subflows/at-history.yaml
- extendedWaitUntil:
    visible: Add a transaction
    timeout: 20000
- tapOn: Add a transaction
- extendedWaitUntil:
    visible: STEP 1 OF 3 · AMOUNT
    timeout: 10000
- tapOn: "4"
- tapOn: Next
- extendedWaitUntil:
    visible: STEP 2 OF 3 · DETAILS
    timeout: 10000
- tapOn: Pick a date
- extendedWaitUntil:
    visible: OK
    timeout: 10000
- takeScreenshot: shots/4b/flow-add-calendar
- tapOn: "1"
- tapOn: OK
- extendedWaitUntil:
    visible: "[A-Z][a-z]{2} 1 [A-Z][a-z]{2}"
    timeout: 10000
- takeScreenshot: shots/4b/flow-add-date-picked
- tapOn: "[A-Z][a-z]{2} 1 [A-Z][a-z]{2}"
- extendedWaitUntil:
    visible: Cancel
    timeout: 10000
- tapOn: Cancel
- extendedWaitUntil:
    visible: "[A-Z][a-z]{2} 1 [A-Z][a-z]{2}"
    timeout: 10000

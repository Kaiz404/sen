# The privacy explainer opens from History's header and leaves shown amounts shown.
appId: com.kaiz404.sen
---
- runFlow: subflows/at-history.yaml
- tapOn: Show amounts
- extendedWaitUntil:
    visible: Hide amounts
    timeout: 10000
- tapOn: How Sen keeps amounts private
- extendedWaitUntil:
    visible: Got it
    timeout: 10000
- assertVisible: How Sen keeps amounts private
- takeScreenshot: shots/p5/history-privacy-sheet
- tapOn: Got it
- extendedWaitUntil:
    visible: Hide amounts
    timeout: 10000

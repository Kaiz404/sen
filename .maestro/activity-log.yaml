# Not run yet: needs a device. An unlock, then Settings > Security activity lists it, with no amount anywhere. Clear log asks for the check and leaves the one entry that says so.
appId: com.kaiz404.sen
---
- runFlow:
    file: subflows/at-lock.yaml
    env:
      AUTH: pass
- tapOn:
    id: unlock
- extendedWaitUntil:
    visible:
      id: tx-row
    timeout: 30000
- tapOn: Settings
- scrollUntilVisible:
    element: Security activity
    direction: DOWN
    centerElement: true
- tapOn: Security activity
- extendedWaitUntil:
    visible: Unlocked with fingerprint
    timeout: 10000
- assertNotVisible: RM.*
- takeScreenshot: shots/activity/log
- tapOn: Clear log
- extendedWaitUntil:
    visible: Log cleared
    timeout: 10000
- assertNotVisible: Unlocked with fingerprint
- takeScreenshot: shots/activity/cleared
